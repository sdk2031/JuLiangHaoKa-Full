    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html,
      body,
      #app {
        min-height: 100%;
        background-color: #fafbfc;
      }

      html.dark,
      html.dark body,
      html.dark #app {
        color-scheme: dark;
        background-color: #070707;
      }

      html.public-shop-light,
      html.public-shop-light body,
      html.public-shop-light #app {
        color-scheme: light;
        background-color: #f6f8fb !important;
      }
    </style>

    <script>
      // 官网入口预跳转：在 Vue 应用启动前判断是否直接进入代理后台。
      ;(function () {
        try {
          const path = window.location.pathname.replace(/\/+$/, '') || '/'
          if ((path !== '/' && path !== '/portal') || window.location.hash) return

          const isMobile =
            /Android|webOS|iPhone|iPod|BlackBerry|IEMobile|Opera Mini|Mobile/i.test(
              navigator.userAgent || ''
            ) || window.innerWidth <= 760

          window.__PUBLIC_PORTAL_ENTRY_PROMISE__ = fetch('/index/site/entry', {
            credentials: 'same-origin',
            headers: {
              Accept: 'application/json',
              'X-Requested-With': 'XMLHttpRequest'
            }
          })
            .then(function (response) {
              return response.ok ? response.json() : null
            })
            .then(function (result) {
              const data = result && result.data ? result.data : {}
              return data.entry || null
            })
            .catch(function () {
              return null
            })

          window.__PUBLIC_PORTAL_ENTRY_PROMISE__.then(function (entry) {
              entry = entry || {}
              if (entry.mode !== 'agent') return

              const target = String(isMobile ? entry.mobileUrl || '' : entry.pcUrl || '').trim()
              window.location.replace(target || (isMobile ? '/h5' : '/#/agent'))
            })
        } catch (e) {}
      })()
    </script>

    <script>
      // 兼容线上误访问无 hash 后台路径，避免浏览器进入 ThinkPHP 旧后台模板。
      ;(function () {
        try {
          if (window.location.hash) return
          const path = window.location.pathname.replace(/\/+$/, '') || '/'
          const targetMap = {
            '/admin': '/admin',
            '/admin/login': '/admin',
            '/admin/index': '/admin/dashboard/index',
            '/admin/index/dashboard': '/admin/dashboard/index',
            '/admin/index/main': '/admin/dashboard/index',
            '/admin/index/stats': '/admin/dashboard/index',
            '/agent': '/agent',
            '/agent/login': '/agent',
            '/agent/index': '/agent/dashboard/index',
            '/agent/index/dashboard': '/agent/dashboard/index',
            '/agent/index/home': '/agent/dashboard/index',
            '/agent/index/main': '/agent/dashboard/index'
          }
          const target = targetMap[path]
          if (!target) return
          window.location.replace('/#' + target + window.location.search)
        } catch (e) {
          console.warn('Failed to normalize backend entry:', e)
        }
      })()
    </script>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const isPublicShop = /^\/#\/shop(\/|$)|^\/#\/pay(\/|$)|^#\/shop(\/|$)|^#\/pay(\/|$)/.test(
            window.location.hash || ''
          )
          if (isPublicShop) {
            document.documentElement.classList.add('public-shop-light')
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
