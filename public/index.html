    <link rel="shortcut icon" type="image/png" href="/logo.png" />

    <style>
      /* 防止页面刷新时白屏的初始样式 */
      html,
      body,
      #app {
        min-height: 100%;
        background-color: #fafbfc;
      }

      html.dark,
      html.dark body,
      html.dark #app {
        color-scheme: dark;
        background-color: #070707;
      }

      html.public-shop-light,
      html.public-shop-light body,
      html.public-shop-light #app {
        color-scheme: light;
        background-color: #f6f8fb !important;
      }
    </style>

    <script>
      // 初始化 html class 主题属性
      ;(function () {
        try {
          if (typeof Storage === 'undefined' || !window.localStorage) {
            return
          }

          const isPublicShop = /^\/#\/shop(\/|$)|^\/#\/pay(\/|$)|^#\/shop(\/|$)|^#\/pay(\/|$)/.test(
            window.location.hash || ''
          )
          if (isPublicShop) {
            document.documentElement.classList.add('public-shop-light')
            return
          }

          const themeType = localStorage.getItem('sys-theme')
          if (themeType === 'dark') {
            document.documentElement.classList.add('dark')
          }
        } catch (e) {
          console.warn('Failed to apply initial theme:', e)
        }
      })()
    </script>
